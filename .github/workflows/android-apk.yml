name: Android APK build
# Build a standalone Release APK and verify its embedded React Native bundle before upload.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/secure-family-backend

permissions:
  contents: read

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install app dependencies
        working-directory: apps/android
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: apps/android
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: apps/android
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build installable Release APK
        working-directory: apps/android/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify standalone JavaScript bundle is packaged
        working-directory: apps/android/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          if unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle|assets/index\.android\.bundle\.hbc'; then
            echo "Verified: Android JavaScript bundle is packaged in the Release APK."
          else
            echo "ERROR: Release APK does not contain the embedded Android JavaScript bundle."
            unzip -l "$APK" | head -80
            exit 1
          fi

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: steve-control-test-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
