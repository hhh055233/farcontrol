name: Android APK check

on:
  push:
    branches:
      - feature/secure-family-backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install app dependencies
        working-directory: apps/android
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: apps/android
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: apps/android
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build installable test APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: steve-family-test-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
